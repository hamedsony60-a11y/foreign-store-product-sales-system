<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه | پیگیری سفارش</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="content">
  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <a href="index.html" class="logo">فروش<span>گاه</span></a>
        <nav class="nav" id="mainNav"></nav>
      </div>
      <div class="header-left">
        <button class="icon-btn" type="button" onclick="openCart()"><span class="cart-count" id="cartCount">0</span></button>
        <button class="menu-toggle icon-btn" type="button" onclick="toggleMenu()">☰</button>
      </div>
    </div>
  </header>

  <main class="page-fade">
    <section class="section content-page">
      <h1 class="section-title">پیگیری سفارش</h1>
      <p class="section-sub">کد سفارش را وارد کنید یا آخرین سفارش ذخیره‌شده را ببینید</p>

      <div class="content-card" style="max-width:480px;margin:0 auto 20px">
        <div class="form-group">
          <label for="trackCode">کد سفارش</label>
          <input type="text" id="trackCode" placeholder="مثلاً ORD-12345678" />
        </div>
        <button type="button" class="btn-primary" style="width:100%;justify-content:center" onclick="doTrack()">پیگیری</button>
      </div>

      <div class="content-card" id="trackResult" hidden style="max-width:480px;margin:0 auto">
        <h3 style="margin-top:0">نتیجه پیگیری</h3>
        <div id="trackBody"></div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>
  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header"><h3>سبد</h3><button class="cart-close" onclick="closeCart()">×</button></div>
    <div class="cart-total-bar">
      <div class="cart-total-row" id="cartTotalRow"><span class="cart-total-label">جمع</span><span class="cart-total-price" id="cartTotal">۰</span></div>
      <button class="btn-checkout" onclick="location.href='checkout.html'">پرداخت</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
  </aside>

  <script src="products-data.js"></script>
  <script src="script.js"></script>
  <script>
    function doTrack() {
      var code = (document.getElementById('trackCode').value || '').trim().toUpperCase();
      var last = null;
      try { last = JSON.parse(localStorage.getItem('last_order') || 'null'); } catch (e) {}
      var box = document.getElementById('trackResult');
      var body = document.getElementById('trackBody');
      box.hidden = false;

      if (last && (!code || code === String(last.code || '').toUpperCase())) {
        var steps = ['ثبت سفارش', 'پرداخت', 'خرید از فروشگاه', 'حمل بین‌المللی', 'تحویل'];
        var active = last.status === 'paid' ? 2 : 1;
        var html = '<p><strong>کد:</strong> ' + (last.code || '—') + '</p>';
        html += '<p><strong>وضعیت:</strong> ' + (last.status === 'paid' ? 'پرداخت‌شده — در صف خرید' : (last.status || '—')) + '</p>';
        if (last.total) html += '<p><strong>مبلغ:</strong> ' + (typeof formatPrice === 'function' ? formatPrice(last.total) : last.total) + '</p>';
        if (last.name) html += '<p><strong>گیرنده:</strong> ' + last.name + '</p>';
        html += '<div style="margin-top:16px">';
        steps.forEach(function (s, i) {
          var done = i < active;
          html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
            '<span style="width:22px;height:22px;border-radius:50%;background:' + (done ? 'var(--brand)' : '#ddd') + ';color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px">' +
            (done ? '✓' : (i + 1)) + '</span><span style="font-weight:' + (done ? '700' : '400') + '">' + s + '</span></div>';
        });
        html += '</div>';
        body.innerHTML = html;
        return;
      }

      if (code) {
        body.innerHTML = '<p class="calc-note">سفارشی با کد <strong>' + code + '</strong> در این دستگاه پیدا نشد. اگر همین الان پرداخت کرده‌اید، کد آخرین سفارش را از صفحه حساب کاربری بردارید.</p>';
      } else {
        body.innerHTML = '<p class="calc-note">کد سفارش را وارد کنید یا ابتدا یک سفارش تستی از <a href="checkout.html" style="color:var(--brand)">تسویه حساب</a> ثبت کنید.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      var lastCode = localStorage.getItem('last_order_code');
      if (lastCode) {
        document.getElementById('trackCode').value = lastCode;
        setTimeout(doTrack, 200);
      }
    });
  </script>
</body>
</html>
