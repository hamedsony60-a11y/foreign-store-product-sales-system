<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه | حساب کاربری</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="content">
  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <a href="index.html" class="logo">فروش<span>گاه</span></a>
        <nav class="nav" id="mainNav"></nav>
      </div>
      <div class="header-left">
        <div class="search-wrap">
          <button class="icon-btn" type="button" aria-label="جستجو">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          </button>
          <input type="text" class="search-input" id="headerSearch" placeholder="جستجو..." />
        </div>
        <button class="icon-btn" type="button" onclick="openCart()"><span class="cart-count" id="cartCount">0</span></button>
        <button class="menu-toggle icon-btn" type="button" onclick="toggleMenu()">☰</button>
      </div>
    </div>
  </header>

  <main class="page-fade">
    <section class="section content-page">
      <h1 class="section-title">حساب کاربری</h1>
      <p class="section-sub">ورود، سفارش‌ها و اطلاعات شما</p>

      <div id="accountGuest" class="content-card" style="max-width:440px;margin:0 auto">
        <h3 style="margin-top:0">ورود / ثبت‌نام</h3>
        <div class="form-group">
          <label for="accName">نام</label>
          <input type="text" id="accName" placeholder="مثلاً علی رضایی" />
        </div>
        <div class="form-group">
          <label for="accPhone">موبایل</label>
          <input type="tel" id="accPhone" placeholder="09121234567" />
        </div>
        <button type="button" class="btn-primary" style="width:100%;justify-content:center" onclick="accountLogin()">ورود به حساب</button>
        <p class="calc-note" style="margin-top:12px">اطلاعات فقط روی همین دستگاه ذخیره می‌شود (بدون سرور).</p>
      </div>

      <div id="accountUser" hidden>
        <div class="content-card" style="max-width:560px;margin:0 auto 20px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <div>
              <h3 style="margin:0" id="accHello">سلام</h3>
              <p class="calc-note" id="accPhoneShow" style="margin:4px 0 0"></p>
            </div>
            <button type="button" class="store-link" onclick="accountLogout()">خروج</button>
          </div>
        </div>

        <div class="steps-grid" style="max-width:560px;margin:0 auto 20px">
          <a class="step-card" href="track-order.html"><h3>پیگیری سفارش</h3><p>وضعیت آخرین سفارش‌ها</p></a>
          <a class="step-card" href="checkout.html"><h3>تسویه حساب</h3><p>ادامه خرید از سبد</p></a>
          <a class="step-card" href="calculator.html"><h3>سفارش جدید</h3><p>از لینک فروشگاه خارجی</p></a>
        </div>

        <div class="content-card" style="max-width:560px;margin:0 auto">
          <h3 style="margin-top:0">آخرین سفارش</h3>
          <div id="accLastOrder"><p class="calc-note">هنوز سفارشی ثبت نشده.</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>
  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header"><h3>سبد</h3><button class="cart-close" onclick="closeCart()">×</button></div>
    <div class="cart-total-bar">
      <div class="cart-total-row" id="cartTotalRow"><span class="cart-total-label">جمع</span><span class="cart-total-price" id="cartTotal">۰</span></div>
      <button class="btn-checkout" onclick="location.href='checkout.html'">پرداخت</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
  </aside>

  <script src="products-data.js"></script>
  <script src="script.js"></script>
  <script>
    function accountLogin() {
      var name = (document.getElementById('accName').value || '').trim();
      var phone = (document.getElementById('accPhone').value || '').trim();
      if (!name || !phone) {
        showToast('نام و موبایل را وارد کنید');
        return;
      }
      if (!/^09\d{9}$/.test(phone)) {
        showToast('موبایل را درست وارد کنید (مثلاً 09121234567)');
        return;
      }
      localStorage.setItem('shop_user', JSON.stringify({ name: name, phone: phone, at: new Date().toISOString() }));
      showToast('وارد شدید');
      renderAccount();
    }
    function accountLogout() {
      localStorage.removeItem('shop_user');
      showToast('خارج شدید');
      renderAccount();
    }
    function renderAccount() {
      var raw = localStorage.getItem('shop_user');
      var guest = document.getElementById('accountGuest');
      var user = document.getElementById('accountUser');
      if (!raw) {
        guest.hidden = false;
        user.hidden = true;
        return;
      }
      var u = JSON.parse(raw);
      guest.hidden = true;
      user.hidden = false;
      document.getElementById('accHello').textContent = 'سلام، ' + u.name;
      document.getElementById('accPhoneShow').textContent = u.phone;
      var orderRaw = localStorage.getItem('last_order');
      var box = document.getElementById('accLastOrder');
      if (!orderRaw) {
        box.innerHTML = '<p class="calc-note">هنوز سفارشی ثبت نشده. <a href="products.html" style="color:var(--brand)">شروع خرید</a></p>';
        return;
      }
      try {
        var o = JSON.parse(orderRaw);
        box.innerHTML =
          '<p><strong>کد:</strong> ' + (o.code || '—') + '</p>' +
          '<p><strong>مبلغ:</strong> ' + (typeof formatPrice === 'function' ? formatPrice(o.total || 0) : (o.total || 0)) + '</p>' +
          '<p><strong>وضعیت:</strong> ' + (o.status === 'paid' ? 'پرداخت‌شده' : (o.status || '—')) + '</p>' +
          '<p style="margin-top:12px"><a href="track-order.html" class="btn-primary">پیگیری</a></p>';
      } catch (e) {
        box.innerHTML = '<p class="calc-note">سفارشی یافت نشد.</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(renderAccount, 150);
    });
  </script>
</body>
</html>
